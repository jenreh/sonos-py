# https://taskfile.dev

version: "3"
silent: true

vars:
  PROJECT: sonos-py
  RUNNER: uv run

tasks:
  default:
    desc: Show available commands
    cmd: task --list

  # ----------------------------------------------------------------------------
  # Project Initialization and Dependency Management
  # ----------------------------------------------------------------------------

  init:
    desc: Initialize project (install python, sync deps, setup pre-commit)
    vars:
      PYTHON_VERSION:
        sh: |
          grep 'requires-python' pyproject.toml | sed -E 's/.*>=?([0-9]+\.[0-9]+).*/\1/'
    cmds:
      - echo "🐍 Installing Python {{.PYTHON_VERSION}}..."
      - uv python install {{.PYTHON_VERSION}}
      - uv python pin {{.PYTHON_VERSION}}
      - echo "📦 Syncing dependencies..."
      - uv sync --all-extras
      - echo "🔒 Installing pre-commit hooks..."
      - uv tool list | grep -q pre-commit || uv tool install pre-commit
      - uv run pre-commit install

  install:
    desc: Install all dependencies (including dev extras)
    cmd: uv sync --all-extras

  sync:
    desc: Install dependencies using uv
    cmd: uv sync

  # ----------------------------------------------------------------------------
  # Quality Assurance (Tests, Lint, Format)
  # ----------------------------------------------------------------------------

  test:
    desc: Run pytest with coverage
    cmd: "{{.RUNNER}} pytest --cov"

  test:live:
    desc: Run live Sonos hardware tests (requires --sonos-room)
    cmd: "{{.RUNNER}} pytest -m sonos_live {{.CLI_ARGS}}"

  lint:
    desc: Run linting with ruff
    cmd: "{{.RUNNER}} ruff check ."

  format:
    desc: Format code with ruff
    cmds:
      - "{{.RUNNER}} ruff check --fix ."
      - "{{.RUNNER}} ruff format ."

  typecheck:
    desc: Run mypy type checking
    cmd: "{{.RUNNER}} mypy sonos/"

  clean:
    desc: Clean cache and build artifacts
    ignore_error: true
    cmds:
      - rm -rf __pycache__/ .cache/ dist/ build/
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  # ----------------------------------------------------------------------------
  # Release Commands
  # ----------------------------------------------------------------------------

  release:build:
    desc: |
      Usage: task release:build -- [major|minor|patch], defaults to 'patch'.
      Bumps version, commits, and creates a GitHub release.
    cmds:
      - uvx bump-my-version bump {{.CLI_ARGS | default "patch"}}
      - uv sync
      - git add -A
      - 'git diff --cached --quiet || git commit -m "chore: release v$(grep ''^version = '' pyproject.toml | cut -d ''"'' -f2)"'
      - git push
      - 'gh release create v$(grep ''^version = '' pyproject.toml | cut -d ''"'' -f2) --generate-notes'
